<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-center d-flex flex-column align-items-center pt-5">

<h1 class="text-success mb-2">Välkommen!</h1>
<p class="text-muted mb-4">
    Du är nu inloggad som <strong th:text="${#authentication.name}"></strong>
</p>

<div style="width: 250px;">
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-danger w-100">Logga ut</button>
    </form>
</div>

</body>
</html>
