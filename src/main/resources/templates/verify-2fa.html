<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verifiera 2FA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center mb-2 text-primary">Steg 2 av 2</h3>
    <p class="text-center text-muted mb-4">Verifiera din kod från authenticator-appen</p>

    <form th:action="@{/verify-2fa}" method="post">
        <div class="mb-3">
            <label class="form-label">Ange 6-siffrig kod</label>
            <input type="text" name="code" maxlength="6" class="form-control" placeholder="Exempel: 123456">
        </div>

        <button type="submit" class="btn btn-primary w-100">Verifiera kod</button>
    </form>

    <p class="text-danger mt-3 text-center" th:if="${error}" th:text="${error}"></p>
</div>

</body>
</html>
