<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>QR Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow p-4 text-center" style="width: 400px;">
    <h4 class="text-primary mb-3">Scanna QR-koden</h4>

    <p><strong th:text="${username}"></strong></p>

    <img th:src="'data:image/png;base64,' + ${qrCode}" class="img-fluid mb-3">

    <p class="text-muted">Använd Microsoft Authenticator</p>
    <a th:href="@{/login}" class="btn btn-primary w-100">Fortsätt till inloggning</a>
</div>

</body>
</html>
