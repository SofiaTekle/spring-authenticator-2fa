<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center mb-3 text-primary">Registrera</h3>

    <form th:action="@{/register}" th:object="${appUser}" method="post">

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{username}" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Lösenord</label>
            <input type="password" th:field="*{password}" class="form-control">
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{twoFactorEnabled}" class="form-check-input">
            <label class="form-check-label">Aktivera 2FA</label>
        </div>

        <button type="submit" class="btn btn-primary w-100">Registrera</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/login}">Till login</a>
    </div>
</div>

</body>
</html>
